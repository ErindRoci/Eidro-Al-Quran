<!DOCTYPE html>
<html lang="sq" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eidro Al Quran">
<meta name="description" content="Dëgjo dhe ndjej qetësinë e Kuranit">
<title>Eidro Al Quran</title>
<link rel="manifest" href="#" id="manifest-link">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Tajawal:wght@300;400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #c9a84c;
  --gold-light: #e8c97a;
  --gold-dim: #8a6f30;
  --bg: #0a0a0a;
  --bg2: #111111;
  --bg3: #1a1a1a;
  --surface: rgba(255,255,255,0.04);
  --surface-hover: rgba(201,168,76,0.08);
  --border: rgba(201,168,76,0.15);
  --border-hover: rgba(201,168,76,0.35);
  --text: #f0ece0;
  --text-dim: #8a8478;
  --text-muted: #4a4640;
  --radius: 16px;
  --radius-lg: 24px;
  --shadow-gold: 0 0 40px rgba(201,168,76,0.12);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Cormorant Garamond', Georgia, serif;
  overflow: hidden;
  overscroll-behavior: none;
}

/* ── SPLASH ── */
#splash {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: #0a0a0a;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
#splash.hidden { opacity: 0; visibility: hidden; }
#splash-logo {
  width: 180px; height: 180px;
  object-fit: contain;
  animation: splashPulse 2s ease-in-out infinite;
  filter: drop-shadow(0 0 30px rgba(201,168,76,0.4));
}
#splash-title {
  margin-top: 28px;
  font-size: 2rem; letter-spacing: 0.25em;
  font-weight: 300; color: var(--text);
}
#splash-sub {
  margin-top: 10px;
  font-size: 0.9rem; color: var(--text-dim);
  letter-spacing: 0.1em; font-family: 'Cormorant Garamond', serif;
  font-style: italic;
}
#splash-loader {
  margin-top: 48px;
  width: 120px; height: 2px;
  background: var(--bg3);
  border-radius: 2px; overflow: hidden;
}
#splash-loader-bar {
  height: 100%; width: 0;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  animation: loadBar 2.2s ease forwards;
  border-radius: 2px;
}
@keyframes loadBar { to { width: 100%; } }
@keyframes splashPulse {
  0%,100% { opacity:0.85; transform: scale(1); }
  50% { opacity:1; transform: scale(1.04); }
}

/* ── APP SHELL ── */
#app {
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  overflow: hidden;
}

/* ── HEADER ── */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px;
  background: rgba(10,10,10,0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative; z-index: 100;
}
.header-logo {
  display: flex; align-items: center; gap: 12px;
  cursor: pointer;
}
.header-logo img {
  height: 36px; width: auto;
  filter: drop-shadow(0 0 8px rgba(201,168,76,0.5));
}
.header-logo-text {
  font-size: 1.1rem; letter-spacing: 0.2em;
  font-weight: 400; color: var(--text);
}
.header-actions {
  display: flex; gap: 8px;
}
.icon-btn {
  width: 40px; height: 40px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text-dim);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s;
  font-size: 18px;
}
.icon-btn:hover, .icon-btn.active {
  border-color: var(--gold);
  color: var(--gold);
  background: var(--surface-hover);
  box-shadow: var(--shadow-gold);
}

/* ── SEARCH BAR ── */
#search-bar {
  padding: 12px 24px;
  background: rgba(10,10,10,0.8);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: none;
}
#search-bar.visible { display: block; }
#search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 16px 10px 40px;
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
  position: relative;
}
#search-input:focus { border-color: var(--gold); }
.search-wrap { position: relative; }
.search-icon {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim); font-size: 16px;
  pointer-events: none;
}

/* ── FILTER TABS ── */
#filter-tabs {
  display: flex; gap: 8px;
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
#filter-tabs::-webkit-scrollbar { display: none; }
.filter-tab {
  padding: 6px 18px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.9rem;
  letter-spacing: 0.05em;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.filter-tab:hover { border-color: var(--gold-dim); color: var(--text); }
.filter-tab.active {
  background: rgba(201,168,76,0.1);
  border-color: var(--gold);
  color: var(--gold);
}

/* ── SURAH LIST ── */
#surah-list {
  flex: 1; overflow-y: auto;
  padding: 16px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
#surah-list::-webkit-scrollbar { width: 4px; }
#surah-list::-webkit-scrollbar-track { background: transparent; }
#surah-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.surah-card {
  display: flex; align-items: center;
  padding: 16px 20px;
  margin-bottom: 8px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  backdrop-filter: blur(10px);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
  animation: cardIn 0.4s ease both;
  position: relative; overflow: hidden;
}
.surah-card::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(201,168,76,0.05) 0%, transparent 60%);
  opacity: 0; transition: opacity 0.3s;
}
.surah-card:hover {
  border-color: var(--border-hover);
  background: var(--surface-hover);
  transform: translateY(-2px) scale(1.005);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 24px rgba(201,168,76,0.08);
}
.surah-card:hover::before { opacity: 1; }
@keyframes cardIn {
  from { opacity:0; transform: translateY(16px); }
  to { opacity:1; transform: translateY(0); }
}
.surah-num {
  width: 44px; height: 44px; flex-shrink: 0;
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; color: var(--gold);
  font-family: 'Cormorant Garamond', serif;
  letter-spacing: 0.05em;
  background: rgba(201,168,76,0.06);
  margin-right: 16px;
}
.surah-info { flex: 1; min-width: 0; }
.surah-arabic {
  font-family: 'Amiri', serif;
  font-size: 1.4rem;
  color: var(--gold-light);
  line-height: 1.2;
  direction: rtl;
}
.surah-latin {
  font-size: 1rem; font-weight: 500;
  color: var(--text); margin-top: 2px;
  letter-spacing: 0.03em;
}
.surah-sq {
  font-size: 0.8rem; color: var(--text-dim);
  letter-spacing: 0.05em; margin-top: 2px;
  font-style: italic;
}
.surah-meta {
  display: flex; flex-direction: column;
  align-items: flex-end; gap: 6px;
  flex-shrink: 0; margin-left: 12px;
}
.surah-ayahs {
  font-size: 0.75rem; color: var(--text-muted);
  letter-spacing: 0.05em;
}
.surah-type {
  font-size: 0.65rem; padding: 2px 8px;
  border-radius: 8px;
  letter-spacing: 0.05em;
}
.surah-type.mekke {
  background: rgba(201,168,76,0.1);
  border: 1px solid rgba(201,168,76,0.25);
  color: var(--gold-dim);
}
.surah-type.medine {
  background: rgba(100,160,120,0.1);
  border: 1px solid rgba(100,160,120,0.25);
  color: #6aaa80;
}
.listen-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(201,168,76,0.1);
  border: 1px solid rgba(201,168,76,0.3);
  color: var(--gold);
  display: flex; align-items: center; justify-content: center;
  margin-left: 12px; flex-shrink: 0;
  transition: all 0.2s;
  font-size: 14px;
}
.surah-card:hover .listen-btn {
  background: rgba(201,168,76,0.2);
  border-color: var(--gold);
  box-shadow: 0 0 16px rgba(201,168,76,0.2);
}

/* ── SURAH VIEW ── */
#surah-view {
  position: fixed; inset: 0; z-index: 200;
  background: var(--bg);
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
}
#surah-view.open { transform: translateX(0); }

#sv-header {
  display: flex; align-items: center;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: rgba(10,10,10,0.9);
  backdrop-filter: blur(20px);
}
.sv-back {
  width: 40px; height: 40px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s;
  font-size: 18px; margin-right: 16px; flex-shrink: 0;
}
.sv-back:hover { border-color: var(--gold); color: var(--gold); }
.sv-title-wrap { flex: 1; }
.sv-arabic-title {
  font-family: 'Amiri', serif;
  font-size: 1.6rem; color: var(--gold-light);
  direction: rtl;
}
.sv-latin-title {
  font-size: 0.9rem; color: var(--text-dim);
  letter-spacing: 0.1em; margin-top: 2px;
}

/* ── AUDIO PLAYER ── */
#audio-player {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  flex-shrink: 0;
}
.player-top {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 16px;
}
.player-cover {
  width: 56px; height: 56px;
  border-radius: 12px; object-fit: cover;
  border: 1px solid var(--border);
  box-shadow: 0 0 20px rgba(201,168,76,0.15);
}
.player-info { flex: 1; }
.player-surah-name {
  font-size: 1rem; font-weight: 500;
  color: var(--text); letter-spacing: 0.05em;
}
.player-reciter {
  font-size: 0.8rem; color: var(--text-dim);
  margin-top: 2px; font-style: italic;
}
.player-controls {
  display: flex; align-items: center; gap: 16px;
}
.ctrl-btn {
  width: 36px; height: 36px;
  border-radius: 50%; border: none;
  background: transparent;
  color: var(--text-dim);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 18px; transition: all 0.2s;
}
.ctrl-btn:hover { color: var(--text); }
.ctrl-play {
  width: 48px; height: 48px;
  background: var(--gold);
  color: #0a0a0a; border-radius: 50%;
  border: none; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s;
  box-shadow: 0 0 20px rgba(201,168,76,0.35);
}
.ctrl-play:hover { background: var(--gold-light); transform: scale(1.05); }
.progress-wrap { margin-top: 12px; }
.progress-bar {
  width: 100%; height: 3px;
  background: var(--bg3);
  border-radius: 3px; cursor: pointer;
  position: relative; overflow: hidden;
}
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  border-radius: 3px;
  transition: width 0.5s linear;
  position: relative;
}
.progress-fill::after {
  content: '';
  position: absolute; right: -4px; top: 50%;
  transform: translateY(-50%);
  width: 8px; height: 8px;
  background: var(--gold); border-radius: 50%;
  box-shadow: 0 0 8px rgba(201,168,76,0.6);
}
.time-row {
  display: flex; justify-content: space-between;
  margin-top: 6px; font-size: 0.72rem;
  color: var(--text-muted); font-family: 'Cormorant Garamond', serif;
}

/* ── AYAH LIST ── */
#ayah-list {
  flex: 1; overflow-y: auto;
  padding: 16px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
#ayah-list::-webkit-scrollbar { width: 4px; }
#ayah-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.ayah-card {
  padding: 24px 20px;
  margin-bottom: 8px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  background: var(--surface);
  transition: all 0.4s ease;
  animation: cardIn 0.4s ease both;
}
.ayah-card.active {
  border-color: rgba(201,168,76,0.3);
  background: rgba(201,168,76,0.06);
  box-shadow: 0 0 24px rgba(201,168,76,0.08);
}
.ayah-num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--border);
  font-size: 0.7rem; color: var(--gold);
  margin-bottom: 12px;
}
.ayah-arabic {
  font-family: 'Amiri', serif;
  font-size: 1.6rem; line-height: 2.2;
  color: var(--text);
  direction: rtl; text-align: right;
  margin-bottom: 12px;
}
.ayah-card.active .ayah-arabic { color: var(--gold-light); }
.ayah-latin {
  font-size: 0.9rem; line-height: 1.6;
  color: var(--text-dim); font-style: italic;
  margin-bottom: 8px; letter-spacing: 0.02em;
}
.ayah-sq {
  font-size: 0.85rem; line-height: 1.6;
  color: var(--text-muted);
}

/* ── MINI PLAYER ── */
#mini-player {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 150;
  padding: 12px 20px;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: none;
  align-items: center; gap: 14px;
  box-shadow: 0 -8px 32px rgba(0,0,0,0.4);
}
#mini-player.visible { display: flex; }
.mini-cover {
  width: 44px; height: 44px;
  border-radius: 10px; object-fit: cover;
  border: 1px solid var(--border);
}
.mini-info { flex: 1; min-width: 0; }
.mini-name {
  font-size: 0.9rem; color: var(--text);
  white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis;
}
.mini-sub { font-size: 0.75rem; color: var(--text-dim); }
.mini-play {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--gold);
  border: none; color: #0a0a0a;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s;
  flex-shrink: 0;
}
.mini-play:hover { background: var(--gold-light); }

/* ── GOLD GLOW ── */
.gold-divider {
  width: 60px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 8px auto;
}

/* ── RESPONSIVE ── */
@media (max-width: 480px) {
  header { padding: 12px 16px; }
  #surah-list { padding: 12px; }
  .surah-card { padding: 14px 16px; }
  .surah-arabic { font-size: 1.2rem; }
  #audio-player { padding: 16px; }
  .ayah-arabic { font-size: 1.4rem; }
  #sv-header { padding: 12px 16px; }
}
</style>
</head>

const AYAH_DATA = {
  1: [
    { ar:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ", lat:"Bismi llāhi r-raḥmāni r-raḥīm", sq:"Në emër të Allahut, të Gjithëmëshirshmit, Mëshirëplotit." },
    { ar:"الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", lat:"Al-ḥamdu li-llāhi rabbi l-ʿālamīn", sq:"Lavdërimet i takojnë Allahut, Zotit të botëve." },
    { ar:"الرَّحْمَٰنِ الرَّحِيمِ", lat:"Ar-raḥmāni r-raḥīm", sq:"Të Gjithëmëshirshmit, Mëshirëplotit." },
    { ar:"مَالِكِ يَوْمِ الدِّينِ", lat:"Māliki yawmi d-dīn", sq:"Sunduesit të Ditës së Gjykimit." },
    { ar:"إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ", lat:"Iyyāka naʿbudu wa-iyyāka nastaʿīn", sq:"Vetëm Ty të adhurojmë dhe vetëm prej Teje ndihmë kërkojmë." },
    { ar:"اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ", lat:"Ihdinā ṣ-ṣirāṭa l-mustaqīm", sq:"Udhëzona në rrugën e drejtë." },
    { ar:"صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ", lat:"Ṣirāṭa llaḏīna anʿamta ʿalayhim ġayri l-maġḍūbi ʿalayhim wa-lā ḍ-ḍāllīn", sq:"Rrugën e atyre që i ke begatuar, jo të atyre mbi të cilët ra hidhërimi, e as të të humburve." },
  ]
};

// ── STATE ──
let currentFilter = 'all';
let currentSurah = null;
let isPlaying = false;
let audioEl = document.getElementById('audio-el');

// ── INIT ──
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('splash').classList.add('hidden');
    renderSurahList(SURAHS);
    setupMediaSession();
  }, 2500);
});

// ── RENDER SURAHS ──
function renderSurahList(list) {
  const el = document.getElementById('surah-list');
  el.innerHTML = '';
  list.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'surah-card';
    card.style.animationDelay = `${i * 30}ms`;
    card.innerHTML = `
      <div class="surah-num">${String(s.id).padStart(3,'0').replace(/(\d)(?=(\d{2})+$)/g,'$1')}<br><small style="font-size:0.65rem">${s.id}</small></div>
      <div class="surah-info">
        <div class="surah-arabic">${s.ar}</div>
        <div class="surah-latin">${s.lat}</div>
        <div class="surah-sq">${s.sq}</div>
      </div>
      <div class="surah-meta">
        <div class="surah-ayahs">${s.ayahs} ajete</div>
        <div class="surah-type ${s.type}">${s.type === 'mekke' ? 'Mekase' : 'Medinase'}</div>
      </div>
      <div class="listen-btn">▶</div>
    `;
    card.onclick = () => openSurah(s);
    el.appendChild(card);
  });
}

// ── FILTER & SEARCH ──
function filterSurahs() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = SURAHS.filter(s => 
    (currentFilter === 'all' || s.type === currentFilter) &&
    (s.lat.toLowerCase().includes(q) || s.sq.toLowerCase().includes(q) || s.ar.includes(q))
  );
  renderSurahList(filtered);
}

function setFilter(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterSurahs();
}

function toggleSearch() {
  const bar = document.getElementById('search-bar');
  bar.classList.toggle('visible');
  document.getElementById('search-btn').classList.toggle('active');
  if (bar.classList.contains('visible')) {
    document.getElementById('search-input').focus();
  }
}

function toggleFilter() {
  const tabs = document.getElementById('filter-tabs');
  const isVis = tabs.style.display !== 'none';
  tabs.style.display = isVis ? 'none' : 'flex';
  document.getElementById('filter-btn').classList.toggle('active', !isVis);
}

// ── OPEN SURAH ──
function openSurah(s) {
  currentSurah = s;
  document.getElementById('sv-arabic').textContent = s.ar;
  document.getElementById('sv-latin').textContent = `${s.lat} · ${s.sq} · ${s.ayahs} ajete`;
  document.getElementById('player-name').textContent = `${s.lat} (${s.ar})`;
  
  document.getElementById('surah-view').classList.add('open');
  renderAyahs(s);
  loadAudio(s.audio, s);
  document.getElementById('mini-player').classList.remove('visible');
}

function closeSurah() {
  document.getElementById('surah-view').classList.remove('open');
  if (isPlaying) {
    document.getElementById('mini-player').classList.add('visible');
    document.getElementById('mini-name').textContent = currentSurah ? currentSurah.lat : '—';
  }
}

function goHome() {
  closeSurah();
}

// ── AYAHS ──
function renderAyahs(s) {
  const list = document.getElementById('ayah-list');
  const ayahs = AYAH_DATA[s.id] || generateDemoAyahs(s.ayahs);
  list.innerHTML = '';
  ayahs.forEach((a, i) => {
    const card = document.createElement('div');
    card.className = 'ayah-card';
    card.id = `ayah-${i}`;
    card.style.animationDelay = `${i * 40}ms`;
    card.innerHTML = `
      <div class="ayah-num">${i+1}</div>
      <div class="ayah-arabic">${a.ar}</div>
      <div class="gold-divider"></div>
      <div class="ayah-latin">${a.lat}</div>
      <div class="ayah-sq">${a.sq}</div>
    `;
    list.appendChild(card);
  });
}

function generateDemoAyahs(count) {
  return Array.from({length: Math.min(count, 10)}, (_, i) => ({
    ar: "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ",
    lat: `Ajeti ${i+1} - teksti i plotë disponohet në versionin e plotë`,
    sq: `Ajeti numër ${i+1} — Për të parë të gjitha ajetet, zgjidhni suren e plotë.`
  }));
}

// ── AUDIO ──
function loadAudio(url, s) {
  audioEl.src = url;
  audioEl.load();
  if (isPlaying) { audioEl.play().catch(()=>{}); }
  document.getElementById('mini-name').textContent = s.lat;
}

function togglePlay() {
  if (isPlaying) {
    audioEl.pause();
    isPlaying = false;
    updatePlayBtn('▶');
  } else {
    audioEl.play().then(() => {
      isPlaying = true;
      updatePlayBtn('⏸');
    }).catch(() => {
      isPlaying = false;
    });
  }
}

function updatePlayBtn(icon) {
  document.getElementById('play-btn').textContent = icon;
  document.getElementById('mini-play-btn').textContent = icon;
}

function prevAyah() {}
function nextAyah() {}

audioEl.addEventListener('timeupdate', () => {
  if (!audioEl.duration) return;
  const pct = (audioEl.currentTime / audioEl.duration) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('time-cur').textContent = fmtTime(audioEl.currentTime);
  document.getElementById('time-tot').textContent = fmtTime(audioEl.duration);
});

audioEl.addEventListener('ended', () => {
  isPlaying = false;
  updatePlayBtn('▶');
  document.getElementById('progress-fill').style.width = '0%';
});

function seekAudio(e) {
  if (!audioEl.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const x = e.clientX - rect.left;
  audioEl.currentTime = (x / rect.width) * audioEl.duration;
}

function fmtTime(s) {
  if (isNaN(s)) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

// ── MEDIA SESSION ──
function setupMediaSession() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'Eidro Al Quran',
    artist: 'Mishary Rashid Alafasy',
    album: 'Kurani Famëlartë',
  });
  navigator.mediaSession.setActionHandler('play', () => { audioEl.play(); isPlaying=true; updatePlayBtn('⏸'); });
  navigator.mediaSession.setActionHandler('pause', () => { audioEl.pause(); isPlaying=false; updatePlayBtn('▶'); });
}
